name: Yocto layer check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-layer:
    name: Parse layer with Scarthgap
    runs-on: ubuntu-24.04
    steps:
      - name: Check out meta-dise-player
        uses: actions/checkout@v4

      - name: Check out Poky Scarthgap
        uses: actions/checkout@v4
        with:
          repository: yoctoproject/poky
          ref: scarthgap
          path: poky

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            chrpath \
            cpio \
            debianutils \
            diffstat \
            file \
            gawk \
            iputils-ping \
            libacl1 \
            liblz4-tool \
            locales \
            python3 \
            python3-git \
            python3-jinja2 \
            python3-pexpect \
            python3-pip \
            python3-subunit \
            socat \
            texinfo \
            unzip \
            wget \
            xz-utils \
            zstd
          sudo locale-gen en_US.UTF-8

      - name: Parse layer metadata
        shell: bash
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          source "$GITHUB_WORKSPACE/poky/oe-init-build-env" "$RUNNER_TEMP/build"
          bitbake-layers add-layer "$GITHUB_WORKSPACE"
          bitbake -p
